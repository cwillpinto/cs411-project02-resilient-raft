// Project 2: Resilient Raft -- protobuf schema.
syntax = "proto3";

package raft;

option go_package = "resilient_raft/proto";

message LogEntryProto {
  int64 term = 1;
  bytes command = 2; // serialized KVCommand
}

message RequestVoteArgs {
  int64 term = 1;
  int32 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteReply {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntryProto entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
  // Fast-backtrack hints for conflict resolution (optional optimization,
  // not required, but speeds up log-matching convergence a lot).
  int64 conflict_index = 3;
  int64 conflict_term = 4;
}

service RaftInternal {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
}

message GetRequest {
  string key = 1;
}

message GetReply {
  bool found = 1;
  string value = 2;
  bool not_leader = 3;
  string leader_hint = 4; // address of the current leader, if known
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message DeleteRequest {
  string key = 1;
}

message WriteReply {
  bool success = 1;
  bool not_leader = 2;
  string leader_hint = 3;
}

service KVService {
  rpc Get(GetRequest) returns (GetReply);
  rpc Put(PutRequest) returns (WriteReply);
  rpc Delete(DeleteRequest) returns (WriteReply);
}
